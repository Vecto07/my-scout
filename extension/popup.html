<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Warenkorb</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="popup-header">
        <h1>Warenkorb.</h1>
        <div class="theme-picker" role="group" aria-label="Darstellung auswählen">
          <span class="theme-picker-label">MODUS</span>
          <button class="theme-choice is-active" type="button" data-theme="light" aria-pressed="true">Light</button>
          <button class="theme-choice" type="button" data-theme="dark" aria-pressed="false">Dark</button>
        </div>
      </header>

      <section id="login-section">
        <h2>Willkommen zurück.</h2>
        <form id="login-form">
          <label>
            Benutzername
            <input id="username" type="text" autocomplete="username" placeholder="Dein Benutzername" maxlength="100" required>
          </label>
          <label>
            Passwort
            <input id="password" type="password" autocomplete="current-password" placeholder="Mindestens 8 Zeichen" minlength="8" maxlength="128" required>
          </label>
          <button type="submit">Anmelden</button>
        </form>
        <button id="show-register" type="button">Konto erstellen</button>
      </section>

      <section id="register-section" hidden>
        <h2>Konto erstellen</h2>
        <form id="register-form">
          <label>
            Benutzername
            <input id="register-username" type="text" autocomplete="username" placeholder="Dein Benutzername" maxlength="100" required>
          </label>
          <label>
            E-Mail-Adresse
            <input id="register-email" type="email" autocomplete="email" placeholder="du@beispiel.de" required>
          </label>
          <label>
            Passwort
            <input id="register-password" type="password" autocomplete="new-password" placeholder="Mindestens 8 Zeichen" minlength="8" maxlength="128" required>
          </label>
          <button type="submit">Konto erstellen</button>
        </form>
        <button id="show-login" type="button">Zurück zur Anmeldung</button>
      </section>

      <section id="cart-section" hidden>
        <h2>Neues Produkt hinzufügen</h2>
        <p>Speichere die aktuelle Seite in deiner Sammlung.</p>
        <button id="add-product" type="button">Produkt speichern</button>
        <button id="logout" type="button">Abmelden</button>

        <label id="dev-mode-label">
          <input id="dev-mode" type="checkbox">
          Entwicklermodus
        </label>

        <section id="product-details-section" hidden>
          <h2>Zuletzt gefundenes Produkt</h2>
          <dl id="product-details">
            <dt>Produkt</dt>
            <dd id="product-name">Noch kein Produkt</dd>
            <dt>Gefundene Preise</dt>
            <dd id="product-prices">Noch keine Preise</dd>
            <dt>Link</dt>
            <dd id="product-url">-</dd>
            <dt>Quelle</dt>
            <dd id="product-source">-</dd>
            <dt>Fehler</dt>
            <dd id="product-error" hidden>-</dd>
          </dl>
        </section>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>

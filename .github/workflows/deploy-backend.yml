name: Backend auf Oracle VPS deployen

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: SSH-Schlüssel einrichten
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "$VPS_HOST" ]; then
            echo "::error::VPS_HOST ist nicht als GitHub-Repository-Secret gesetzt."
            exit 1
          fi
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::VPS_SSH_KEY ist nicht als GitHub-Repository-Secret gesetzt."
            exit 1
          fi
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::VPS_KNOWN_HOSTS ist nicht als GitHub-Repository-Secret gesetzt."
            exit 1
          fi

          if [[ "$VPS_HOST" == *"://"* || "$VPS_HOST" == */* ]]; then
            echo "::error::VPS_HOST muss nur einen Hostnamen oder eine IP-Adresse enthalten, ohne Protokoll oder Pfad."
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

          if ! ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null &&
             ! ssh-keygen -F "[$VPS_HOST]:22" -f "$HOME/.ssh/known_hosts" >/dev/null; then
            echo "::error::VPS_KNOWN_HOSTS enthält keinen Host-Key für VPS_HOST."
            echo "::error::Erzeuge den Secret-Wert mit: ssh-keyscan -H $VPS_HOST"
            exit 1
          fi

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend bauen
        working-directory: backend
        run: bash mvnw -B package -DskipTests

      - name: JAR auf VPS kopieren
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i "$HOME/.ssh/deploy_key" \
            backend/target/backend-0.0.1-SNAPSHOT.jar \
            "$VPS_USER@$VPS_HOST:/tmp/universal-cart-backend.jar"

      - name: Backend neu starten
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" "$VPS_USER@$VPS_HOST" \
            "sudo install -o universal-cart -g universal-cart -m 0644 /tmp/universal-cart-backend.jar /opt/universal-cart/backend.jar && sudo systemctl restart universal-cart && sudo systemctl is-active --quiet universal-cart"

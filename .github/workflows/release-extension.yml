name: Extension veröffentlichen

on:
  push:
    branches:
      - main
    paths:
      - "extension/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optionaler Release-Tag, zum Beispiel v1.0.1 (leer = Patch-Version erhöhen)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version erhöhen und Release-Tag bestimmen
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            tag="$DISPATCH_TAG"
          else
            current_version=$(jq -r '.version' extension/manifest.json)
            if ! [[ "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Ungültige Extension-Version: $current_version" >&2
              exit 1
            fi
            IFS=. read -r major minor patch <<< "$current_version"
            next_version="$major.$minor.$((patch + 1))"
            jq --arg version "$next_version" '.version = $version' \
              extension/manifest.json > extension/manifest.json.tmp
            mv extension/manifest.json.tmp extension/manifest.json
            jq --arg version "$next_version" '.version = $version' \
              extension/manifest.firefox.json > extension/manifest.firefox.json.tmp
            mv extension/manifest.firefox.json.tmp extension/manifest.firefox.json
            tag="v$next_version"
          fi

          case "$tag" in
            v*) ;;
            *) echo "Release-Tag muss mit v beginnen: $tag" >&2; exit 1 ;;
          esac

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Der Release-Tag existiert bereits: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Versionsänderung veröffentlichen
        if: inputs.tag == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/manifest.json extension/manifest.firefox.json
          git commit -m "Bump extension version to ${{ steps.release.outputs.tag }} [skip ci]"
          git tag -a "${{ steps.release.outputs.tag }}" -m "Release ${{ steps.release.outputs.tag }}"
          git push origin HEAD:main --follow-tags

      - name: Erweiterung für Chrome paketieren
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p build/chrome dist
          cp -R extension/. build/chrome/
          rm build/chrome/manifest.firefox.json
          (
            cd build/chrome
            zip -qr "../../dist/universal-cart-chrome-${TAG}.zip" .
          )

      - name: Firefox-Paket erstellen
        env:
          TAG: ${{ steps.release.outputs.tag }}
          AMO_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          test -n "$AMO_API_KEY" || { echo "Das GitHub Secret AMO_JWT_ISSUER fehlt." >&2; exit 1; }
          test -n "$AMO_API_SECRET" || { echo "Das GitHub Secret AMO_JWT_SECRET fehlt." >&2; exit 1; }
          rm -rf build/firefox dist/firefox
          mkdir -p build/firefox dist/firefox
          cp -R extension/. build/firefox/
          mv build/firefox/manifest.firefox.json build/firefox/manifest.json
          npx --yes web-ext sign \
            --source-dir build/firefox \
            --artifacts-dir dist/firefox \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --channel unlisted \
            --no-input
          signed_xpi=$(find dist/firefox -maxdepth 1 -type f -name '*.xpi' -print -quit)
          test -n "$signed_xpi" || { echo "web-ext hat kein signiertes Firefox-XPI erzeugt." >&2; exit 1; }
          mv "$signed_xpi" "dist/universal-cart-firefox-${TAG}.xpi"

      - name: GitHub Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "dist/universal-cart-chrome-${TAG}.zip" \
            "dist/universal-cart-firefox-${TAG}.xpi" \
            --title "Universal Cart ${TAG}" \
            --generate-notes
